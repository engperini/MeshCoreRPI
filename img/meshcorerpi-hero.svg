<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="MeshCoreRPI: native MeshCore on Raspberry Pi with a LoRa HAT or a USB MeshStick">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#132a3a"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f8a4c"/>
      <stop offset="1" stop-color="#166c3b"/>
    </linearGradient>
    <linearGradient id="stick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4252"/>
      <stop offset="1" stop-color="#1c2230"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>

  <!-- title -->
  <text x="64" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#f8fafc">MeshCore<tspan fill="#34d399">RPI</tspan></text>
  <text x="66" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#cbd5e1">Native MeshCore on Raspberry Pi</text>
  <text x="66" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#94a3b8">Companion · Repeater · Web dashboard · systemd</text>

  <!-- chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600">
    <rect x="64" y="276" width="168" height="38" rx="19" fill="#0b3b2a" stroke="#34d399"/>
    <text x="148" y="301" text-anchor="middle" fill="#6ee7b7">USB MeshStick</text>
    <rect x="244" y="276" width="160" height="38" rx="19" fill="#0b2a3b" stroke="#38bdf8"/>
    <text x="324" y="301" text-anchor="middle" fill="#7dd3fc">SX1262 HAT</text>
    <rect x="416" y="276" width="104" height="38" rx="19" fill="#2a2140" stroke="#a78bfa"/>
    <text x="468" y="301" text-anchor="middle" fill="#c4b5fd">SX127x</text>
  </g>
  <text x="66" y="356" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#64748b">curl -fsSL …/install.sh | sudo bash</text>

  <!-- Raspberry Pi board -->
  <g transform="translate(640,150)">
    <rect width="250" height="168" rx="12" fill="url(#board)"/>
    <g fill="#e5c07b">
      <circle cx="14" cy="14" r="6"/><circle cx="236" cy="14" r="6"/>
      <circle cx="14" cy="154" r="6"/><circle cx="236" cy="154" r="6"/>
    </g>
    <!-- GPIO header -->
    <rect x="34" y="10" width="182" height="20" rx="3" fill="#111827"/>
    <g fill="#d4af37">
      <rect x="40" y="15" width="6" height="10"/><rect x="51" y="15" width="6" height="10"/><rect x="62" y="15" width="6" height="10"/>
      <rect x="73" y="15" width="6" height="10"/><rect x="84" y="15" width="6" height="10"/><rect x="95" y="15" width="6" height="10"/>
      <rect x="106" y="15" width="6" height="10"/><rect x="117" y="15" width="6" height="10"/><rect x="128" y="15" width="6" height="10"/>
      <rect x="139" y="15" width="6" height="10"/><rect x="150" y="15" width="6" height="10"/><rect x="161" y="15" width="6" height="10"/>
      <rect x="172" y="15" width="6" height="10"/><rect x="183" y="15" width="6" height="10"/><rect x="194" y="15" width="6" height="10"/>
      <rect x="205" y="15" width="6" height="10"/>
    </g>
    <rect x="70" y="62" width="64" height="64" rx="4" fill="#1f2937"/>
    <text x="102" y="100" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9ca3af">SoC</text>
    <!-- USB ports -->
    <rect x="216" y="56" width="44" height="34" rx="3" fill="#cbd5e1"/>
    <rect x="216" y="100" width="44" height="34" rx="3" fill="#cbd5e1"/>
    <rect x="224" y="66" width="30" height="8" fill="#334155"/>
    <rect x="224" y="110" width="30" height="8" fill="#334155"/>
  </g>

  <!-- MeshStick -->
  <g transform="translate(902,193)">
    <rect x="0" y="6" width="26" height="22" rx="2" fill="#cbd5e1"/>
    <rect x="24" y="0" width="150" height="34" rx="8" fill="url(#stick)" stroke="#475569"/>
    <circle cx="44" cy="17" r="4" fill="#22c55e"/>
    <circle cx="58" cy="17" r="4" fill="#3b82f6"/>
    <rect x="174" y="9" width="18" height="16" rx="2" fill="#d4af37"/>
    <!-- antenna -->
    <rect x="186" y="-150" width="16" height="170" rx="8" fill="#2b3245" stroke="#475569" transform="rotate(8 194 17)"/>
  </g>

  <!-- radio waves -->
  <g fill="none" stroke="#34d399" stroke-linecap="round" transform="translate(22,-8)">
    <path d="M1105 70 a34 34 0 0 1 0 54" stroke-width="5" opacity="0.9"/>
    <path d="M1122 52 a58 58 0 0 1 0 90" stroke-width="5" opacity="0.6"/>
    <path d="M1139 34 a82 82 0 0 1 0 126" stroke-width="5" opacity="0.35"/>
  </g>
</svg>
