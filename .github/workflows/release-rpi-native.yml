name: Release Raspberry Pi packages

# Builds the native repeater/companion .deb packages for 64-bit Raspberry Pi OS
# and attaches them to a GitHub release, creating the release if needed
# (notes from docs/release-notes/<tag>.md).
# Built inside Debian bookworm so the binaries also run on older Pi OS releases.
#
# To release: Actions -> "Release Raspberry Pi packages" -> Run workflow,
# enter a new tag (e.g. v0.2.0); it is created on the selected branch.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0); created on the selected branch if it does not exist"
        required: true

permissions:
  contents: write

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl build-essential \
            python3 python3-venv dpkg-dev
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            -o /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            > /etc/apt/sources.list.d/github-cli.list
          apt-get update && apt-get install -y gh

      - uses: actions/checkout@v4
        with:
          # an existing release builds its tag; a manual run builds the selected branch
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Build packages
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -m venv /opt/pio
          /opt/pio/bin/pip install platformio
          export RPI_PKG_VERSION="${TAG#v}"
          rm -rf RaspberryPiMC/dist
          /opt/pio/bin/pio run -e RaspberryPiMC_native_companion
          /opt/pio/bin/pio run -e RaspberryPiMC_native_repeater
          ls -l RaspberryPiMC/dist/*.deb

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            notes="docs/release-notes/${TAG}.md"
            [ -f "$notes" ] || notes=/dev/null
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" \
              --title "$TAG" --notes-file "$notes" --latest
          fi

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" RaspberryPiMC/dist/*.deb --clobber -R "$GITHUB_REPOSITORY"
